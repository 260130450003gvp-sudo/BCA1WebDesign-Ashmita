<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Question 3</title>
</head>
<body>
    <h1><b>Collect feedback from user:</b></h1>
    <hr><br>
    
    <!-- feedback form with all input types -->
     <br>
    <h3><i>Fill the blank from :- </i> </h3>
    <form action="#">
    <br>
        <label><b>Full Name:</b></label><br>
        <br>
        <input type="text" placeholder="Enter Your Name"><br><br>
        <br>

        <label><b>Email Address:</b></label><br>
        <br>
        <input type="email" placeholder="Enter Your Email"><br><br>
        <br>

        <label><b>Age:</b></label><br>
        <br>
        <input type="number" placeholder="Enter Age"><br><br>
        <br>

        <label><b>Date Of Visit:</b></label><br>
        <br>
        <input type="date"><br><br>
        <br>

        <label><b>Mobile Phone:</b></label><br>
        <br>
        <input type="tel" placeholder="Enter Your Mobile Number"><br><br>
        <br>

        <label><b>Website Name:</b></label><br>
        <br>
        <input type="url" placeholder="Enter Website Name"><br><br>
        <br>

        <label><b>Your Rating:</b></label><br>
        <br>
        <input type="range"><br><br>
        <br>

        <label><b>Your Favourite Color:</b></label><br>
        <br>
        <input type="color"><br><br>
        <br>

        <label><b>Upload Screenshot Here:</b></label><br>
        <br>
        <input type="file"><br><br>
        <br>

        <!-- submit and reset button -->
        <input type="submit" value="Register"> <input type="reset" value="Clear This Form">
    </form>
</body>
</html>
